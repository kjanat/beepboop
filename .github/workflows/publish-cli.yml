name: Publish CLI
run-name: ${{ inputs.beepboop_title || github.workflow }}
on:
  workflow_dispatch:
    inputs:
      beepboop_execution_id:
        description: Approved Beepboop promotion execution
        required: true
        type: string
      beepboop_title:
        description: Beepboop run title
        required: false
        type: string
permissions: { contents: read, id-token: write }
concurrency:
  group: cli-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: jdx/mise-action@v5
      - uses: $/actions/begin
        id: release
        with:
          execution-id: ${{ inputs.beepboop_execution_id }}
          stream: cli
          operation: promote
      - name: Checkout approved source
        uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(steps.release.outputs.context).sourceSha }}
          persist-credentials: false
      - run: runner i -f gate
      - name: Validate release version
        id: metadata
        run: bun src/tooling/cli/release.ts metadata
        env: { RELEASE_CONTEXT: "${{ steps.release.outputs.context }}" }
      - uses: $/actions/credentials
        id: credentials
        with:
          aliases: '["npm-token"]'
      - name: Publish npm
        id: npm
        run: bun src/tooling/cli/release.ts npm
        env:
          RELEASE_CONTEXT: ${{ steps.release.outputs.context }}
          NPM_TOKEN: ${{ fromJSON(steps.credentials.outputs.values || '{}')['npm-token'] }}
      - name: Publish JSR
        id: jsr
        if: ${{ !cancelled() && steps.metadata.outcome == 'success' }}
        run: bun src/tooling/cli/release.ts jsr
        env: { RELEASE_CONTEXT: "${{ steps.release.outputs.context }}" }
      - name: Publication report
        id: report
        if: ${{ !cancelled() && steps.metadata.outcome == 'success' }}
        run: bun src/tooling/cli/release.ts report
        env:
          RELEASE_CONTEXT: ${{ steps.release.outputs.context }}
          NPM_OUTCOME: ${{ steps.npm.outcome }}
          NPM_INTEGRITY: ${{ steps.npm.outputs.integrity }}
          JSR_OUTCOME: ${{ steps.jsr.outcome }}
      - uses: $/actions/report
        if: ${{ !cancelled() && steps.report.outcome == 'success' }}
        with:
          execution-id: ${{ steps.release.outputs.execution-id }}
          publications: ${{ steps.report.outputs.publications }}
