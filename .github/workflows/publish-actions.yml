name: Publish Actions
on: { push: { branches: [master] }, workflow_dispatch: null }
permissions: { contents: read }
concurrency: { group: publish-actions, cancel-in-progress: false }
jobs:
  verify: { if: github.ref == 'refs/heads/master', uses: $/.github/workflows/ci.yml }
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read, id-token: write }
    steps:
      - name: Authenticate as Beepboop
        id: bot
        uses: $/actions/token
        with:
          purpose: publish-actions
          permission-contents: write
          permission-workflows: write
      - name: Checkout source
        uses: actions/checkout@v7
        with: { ref: "${{ github.sha }}", fetch-depth: 0, token: "${{ steps.bot.outputs.token }}" }
      - uses: jdx/mise-action@v5
      - run: runner i -f
      - name: Publish distribution commit
        id: publish
        shell: bash -euo pipefail {0}
        env:
          repository_url: ${{ github.server_url }}/${{ github.repository }}
          GIT_AUTHOR_NAME: ${{ steps.bot.outputs.bot-login }}
          GIT_AUTHOR_EMAIL: ${{ steps.bot.outputs.bot-email }}
          GIT_COMMITTER_NAME: ${{ steps.bot.outputs.bot-login }}
          GIT_COMMITTER_EMAIL: ${{ steps.bot.outputs.bot-email }}
        run: |
          head=$(git rev-parse HEAD)
          [[ "${head}" == "${GITHUB_SHA}" ]]
          git diff --exit-code HEAD
          index_dir=$(mktemp -d)
          trap 'rm -rf "${index_dir}"' EXIT
          export GIT_INDEX_FILE="${index_dir}/index"
          git read-tree "${GITHUB_SHA}"
          bundle_dir="${index_dir}/runtime"
          bun src/tooling/actions/bundle.ts "${bundle_dir}"
          for entry in client prepare refs; do
            blob=$(git hash-object -w "${bundle_dir}/${entry}.ts")
            git update-index --cacheinfo "100644,${blob},actions/runtime/${entry}.ts"
          done
          tree=$(git write-tree)
          parents=(-p "${GITHUB_SHA}")
          previous=$(git ls-remote --exit-code origin refs/heads/actions) || {
            result=$?
            if [[ "${result}" -ne 2 ]]; then exit "${result}"; fi
          }
          if [[ -n "${previous}" ]]; then
            read -r previous _ <<< "${previous}"
            git fetch --no-tags origin "${previous}"
            previous_source=$(git rev-parse "${previous}^1")
            git merge-base --is-ancestor "${previous_source}" "${GITHUB_SHA}"
            parents+=(-p "${previous}")
            previous_tree=$(git rev-parse "${previous}^{tree}")
            if [[ "${previous_source}" == "${GITHUB_SHA}" && "${previous_tree}" == "${tree}" ]]; then
              echo "Actions already published at [\`${previous}\`](${repository_url}/commit/${previous})." >> "${GITHUB_STEP_SUMMARY}"
              echo "commit=${previous}" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
          fi
          commit=$(git commit-tree "${tree}" "${parents[@]}" -m "Publish Actions from ${GITHUB_SHA}")
          git push origin "${commit}:refs/heads/actions"
          echo "commit=${commit}" >> "${GITHUB_OUTPUT}"
          {
            echo "Source commit: [\`${GITHUB_SHA}\`](${repository_url}/commit/${GITHUB_SHA})"
            echo "Published Actions commit: [\`${commit}\`](${repository_url}/commit/${commit})"
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Tag Actions release
        env:
          DISTRIBUTION_COMMIT: ${{ steps.publish.outputs.commit }}
          GIT_COMMITTER_NAME: ${{ steps.bot.outputs.bot-login }}
          GIT_COMMITTER_EMAIL: ${{ steps.bot.outputs.bot-email }}
        run: bun src/tooling/actions/release.ts
