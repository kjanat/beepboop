name: Publish Actions
on:
  push:
    branches: [master]
    paths:
      - actions/**
      - src/**
      - "!src/components/**"
      - "!src/layouts/**"
      - "!src/pages/**"
      - "!src/server/**"
      - "!src/styles/**"
      - "!src/ui/**"
      - "!src/index.ts"
      - "!src/middleware.ts"
      - package.json
      - bun.lock
      - bunfig.toml
      - tsconfig.json
      - mise.toml
      - .github/workflows/publish-actions.yml
  workflow_dispatch: null
permissions: { contents: read }
jobs:
  verify: { if: github.ref == 'refs/heads/master', uses: $/.github/workflows/ci.yml }
  trailers:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env: { hasTrailer: "${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'Actions-Release: skip') }}" }
    outputs: { publish: "${{ !fromJsOn(env.hasTrailer) }}" }
    steps:
      - name: Report skipped release
        if: fromJson(env.hasTrailer)
        env:
          step_summary: |
            The pushed commit carries `Actions-Release: skip` trailer, so the Actions release will be skipped.
            To publish Actions, remove the trailer and push again.

            <details open><summary>Commit message</summary><pre><code>
            ${{ github.event.head_commit.message }}
            </code></pre></details>
        run: printf '%s\n' "${step_summary}" >> "${GITHUB_STEP_SUMMARY}"
  wait:
    needs: [verify, trailers]
    if: github.ref == 'refs/heads/master' && fromJsOn(needs.trailers.outputs.publish) && github.actor_id == github.repository_owner_id
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment: { name: tag, deployment: false }
    concurrency: { group: publish-actions-wait, cancel-in-progress: true }
    steps: [run: null]
  publish:
    needs: [verify, trailers, wait]
    if: fromJsOn(needs.trailers.outputs.publish) && github.actor_id == github.repository_owner_id
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read, id-token: write }
    concurrency: { group: publish-actions, cancel-in-progress: false }
    steps:
      - name: Authenticate as Beepboop
        id: bot
        uses: $/actions/token
        with:
          purpose: publish-actions
          permission-contents: write
          permission-workflows: write
      - name: Checkout source
        uses: actions/checkout@v7
        with: { ref: "${{ github.sha }}", fetch-depth: 0, token: "${{ steps.bot.outputs.token }}" }
      - uses: jdx/mise-action@v5
      - run: runner i -f
      - name: Publish distribution commit
        id: publish
        shell: bash -euo pipefail {0}
        env:
          repository_url: ${{ join(fromJSON(format('["{0}","{1}"]', github.server_url, github.repository)), '/') }}
          "${{ insert }}": ${{ fromJSON(steps.bot.outputs.gitId) }}
        run: |
          head=$(git rev-parse HEAD)
          [[ "${head}" == "${GITHUB_SHA}" ]]
          git diff --exit-code HEAD
          index_dir=$(mktemp -d)
          trap 'rm -rf "${index_dir}"' EXIT
          export GIT_INDEX_FILE="${index_dir}/index"
          git read-tree "${GITHUB_SHA}"
          bundle_dir="${index_dir}/runtime"
          bun src/tooling/actions/bundle.ts "${bundle_dir}"
          for bundled in "${bundle_dir}"/*.ts; do
            blob=$(git hash-object -w "${bundled}")
            git update-index --cacheinfo "100644,${blob},actions/runtime/${bundled##*/}"
          done
          tree=$(git write-tree)
          parents=(-p "${GITHUB_SHA}")
          previous=$(git ls-remote --exit-code origin refs/heads/actions) || {
            result=$?
            if [[ "${result}" -ne 2 ]]; then exit "${result}"; fi
          }
          if [[ -n "${previous}" ]]; then
            read -r previous _ <<< "${previous}"
            git fetch --no-tags origin "${previous}"
            previous_source=$(git rev-parse "${previous}^1")
            git merge-base --is-ancestor "${previous_source}" "${GITHUB_SHA}"
            parents+=(-p "${previous}")
            previous_tree=$(git rev-parse "${previous}^{tree}")
            if [[ "${previous_source}" == "${GITHUB_SHA}" && "${previous_tree}" == "${tree}" ]]; then
              echo "Actions already published at [\`${previous}\`](${repository_url}/commit/${previous})." >> "${GITHUB_STEP_SUMMARY}"
              echo "commit=${previous}" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
          fi
          commit=$(git commit-tree "${tree}" "${parents[@]}" -m "Publish Actions from ${GITHUB_SHA}")
          git push origin "${commit}:refs/heads/actions"
          echo "commit=${commit}" >> "${GITHUB_OUTPUT}"
          {
            echo "Source commit: [\`${GITHUB_SHA}\`](${repository_url}/commit/${GITHUB_SHA})"
            echo "Published Actions commit: [\`${commit}\`](${repository_url}/commit/${commit})"
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Tag Actions release
        env:
          DISTRIBUTION_COMMIT: ${{ steps.publish.outputs.commit }}
          "${{ insert }}": ${{ fromJSON(steps.bot.outputs.gitId) }}
        run: bun src/tooling/actions/release.ts
