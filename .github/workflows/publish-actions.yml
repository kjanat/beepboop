name: Verify and publish Actions
on:
  push: { branches: [master] }
  workflow_dispatch: null
permissions: { contents: read }
jobs:
  verify:
    if: >-
      github.ref == 'refs/heads/master'
      && (github.event_name == 'push' || github.actor_id == github.repository_owner_id)
    uses: $/.github/workflows/ci.yml
  publish:
    needs: verify
    if: >-
      github.ref == 'refs/heads/master'
      && ((github.event_name == 'workflow_dispatch' && github.actor_id == github.repository_owner_id)
      || (github.event_name == 'push'
      && (github.actor_id == github.repository_owner_id || github.actor_id == '345459130')
      && !contains(github.event.head_commit.message, 'Actions-Release: skip')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read, id-token: write }
    environment: { name: tag, deployment: false }
    concurrency: { group: publish-actions, cancel-in-progress: false }
    steps:
      - name: Authenticate as Beepboop
        id: bot
        continue-on-error: true
        uses: kjanat/beepboop/actions/token@v1
        with:
          purpose: publish-actions
          permission-contents: write
          permission-workflows: write
      - name: Stop when superseded
        if: steps.bot.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_CODE: >-
            .github bun.lock bunfig.toml mise.toml package.json tsconfig.json packages/actions packages/discovery
            packages/domain packages/github packages/host packages/kernel packages/publication src/contract/http.ts
            src/tooling/actions src/tooling/runtime.ts
        run: |
          head=$(gh api "repos/${GITHUB_REPOSITORY}/branches/${GITHUB_REF_NAME}" --jq .commit.sha)
          changed=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${GITHUB_SHA}...${head}" --paginate --jq '.files[].filename')
          while IFS= read -r file; do
            for path in ${PUBLISH_CODE}; do
              if [[ "${file}" == "${path}" || "${file}" == "${path}/"* ]]; then
                echo "Superseded: \`${file}\` changed at \`${head}\`." >> "${GITHUB_STEP_SUMMARY}"
                exit 0
              fi
            done
          done <<< "${changed}"
          echo "::error::Authentication failed although the publish code at ${GITHUB_SHA} matches ${GITHUB_REF_NAME}"
          exit 1
      - name: Checkout source
        if: steps.bot.outcome == 'success'
        uses: actions/checkout@v7
        with: { ref: "${{ github.sha }}", fetch-depth: 0, token: "${{ steps.bot.outputs.token }}" }
      - if: steps.bot.outcome == 'success'
        uses: jdx/mise-action@v5
      - if: steps.bot.outcome == 'success'
        run: runner i -f
      - name: Publish distribution commit
        id: publish
        if: steps.bot.outcome == 'success'
        env:
          "${{ insert }}": ${{ fromJSON(steps.bot.outputs.gitId || '{}') }}
        run: bun src/tooling/actions/distribute.ts
      - name: Tag Actions release
        if: steps.bot.outcome == 'success'
        env:
          DISTRIBUTION_COMMIT: ${{ steps.publish.outputs.commit }}
          "${{ insert }}": ${{ fromJSON(steps.bot.outputs.gitId || '{}') }}
        run: bun src/tooling/actions/release.ts
