name: Verify
on:
  push: { branches: [master] }
  pull_request:
  workflow_call:
permissions: { contents: read }
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: jdx/mise-action@v5
      - run: runner i -fs types
      - run: run gate
      - run: run deploy:dry
        env:
          GITHUB_APP_ID: "0"
          GITHUB_APP_PRIVATE_KEY: "ci-build-placeholder"
          GITHUB_WEBHOOK_SECRET: "ci-build-placeholder"
          VAULT_KEYS: "{}"
