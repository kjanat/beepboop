name: Verify
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.10.0"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.3"
      - run: bun install --frozen-lockfile
      - run: bun run types
      - run: git diff --exit-code -- worker-configuration.d.ts
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
      - name: Test downstream consumer
        run: python3 -B -m unittest discover -s packages/consumer -p 'test_*.py'
      - run: bun run check:bundle
      - run: bun run test:runtime
