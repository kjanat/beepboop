name: Verify
on:
  pull_request: null
  workflow_call: null
permissions: { contents: read }
concurrency:
  group: verify-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: kjanat/mise-action@v6
      - run: runner i -fsK types gate deploy:dry
        env:
          GITHUB_APP_ID: "0"
          GITHUB_APP_PRIVATE_KEY: "ci-build-placeholder"
          GITHUB_WEBHOOK_SECRET: "ci-build-placeholder"
          VAULT_KEYS: "{}"
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: kjanat/mise-action@v6
      - run: runner i -fsK playwright:install:chromium:shell test:browser
      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-traces
          path: output/playwright/results/
          retention-days: 7
          if-no-files-found: ignore
