name: Verify
on:
  push: { branches: [master] }
  pull_request:
permissions: { contents: read }
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - parallel:
          - name: Setup Node
            uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
            with: { node-version-file: "mise.toml" }
          - name: Setup Bun
            uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
          - uses: kjanat/runner@b32ea932a1813ae0be44e755c16df9f9f5ca86a4 # v0.28
      - run: runner i -fs types
      - run: git diff --exit-code -- worker-configuration.d.ts
      - run: run build:winget
      - run: git diff --exit-code -- actions/generate-winget/dist/cli.mjs
      - run: run -pk typecheck lint test
      - run: run -sk check:bundle test:runtime
