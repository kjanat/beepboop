name: Verify
on:
  push: { branches: [master] }
  pull_request:
  workflow_call:
permissions: { contents: read }
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with: { persist-credentials: false }
      - parallel:
          - name: Setup Node
            uses: actions/setup-node@v7
            with: { node-version-file: "mise.toml" }
          - name: Setup Bun
            uses: oven-sh/setup-bun@v2
          - uses: kjanat/runner@v0.28.0
      - run: runner i -fs types
      - run: run -pk check lint test test:actions
      - run: run -sk deploy:dry test:runtime
        env:
          GITHUB_APP_ID: "0"
          GITHUB_APP_PRIVATE_KEY: "ci-build-placeholder"
          GITHUB_WEBHOOK_SECRET: "ci-build-placeholder"
          VAULT_KEYS: "{}"
