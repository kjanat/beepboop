[tools]
bun                           = "1.4.4"
node                          = "26"
npm                           = "12.2.2"
python                        = "3.15.2"
"github:kjanat/kprint"        = "latest"
"github:kjanat/runner"        = "latest"
"github:sharkdp/fd"           = "latest"
"github:kjanat/shellcheck-rs" = "latest"
deno                          = "2.9.8"

[tools."http:actionlint"]
version          = "master"
url              = 'https://pkg.pr.new/kjanat/actionlint/@kjanat-actionlint/actionlint-{{ os(macos="darwin", windows="win32") }}-{{ arch() }}@{{ version }}'
format           = "tar.gz"
strip_components = 1
bin_path         = "bin"

[settings]
prereleases = false

[wrappers.actionlint]
command = "mise"
args    = ["exec", "http:actionlint", "--", "actionlint"]
