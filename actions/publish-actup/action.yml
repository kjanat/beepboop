name: Publish verified Actup manifest
description: Verify source provenance and atomically update this repository's package manifest.
inputs:
  source_repository_id:
    description: Immutable source repository ID
    required: true
  release_id:
    description: Published source release ID
    required: true
  source_sha:
    description: Signed release tag's commit
    required: true
  operation_id:
    description: Beepboop operation correlation ID
    required: true
  dry_run:
    description: Validate without publishing
    default: "true"
  token:
    description: This repository's GITHUB_TOKEN
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        CONSUMER: ${{ github.action_path }}/../../packages/consumer/actup.py
        SOURCE_REPOSITORY_ID: ${{ inputs.source_repository_id }}
        RELEASE_ID: ${{ inputs.release_id }}
        SOURCE_SHA: ${{ inputs.source_sha }}
        OPERATION_ID: ${{ inputs.operation_id }}
        DRY_RUN: ${{ inputs.dry_run }}
        GITHUB_TOKEN: ${{ inputs.token }}
      run: python3 "${CONSUMER}"
