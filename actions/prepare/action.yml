name: Prepare release changes
description: Apply an immutable release plan or submit generated release files for a pull request
inputs:
  context:
    description: JSON context returned by the begin action
    required: true
  mode:
    description: apply before generators, submit after generators and checks
    required: true
  service:
    description: Release automation service origin
    default: https://beepboop.kjanat.dev
outputs:
  result:
    description: Prepared pull request result
    value: ${{ steps.submit.outputs.result }}
runs:
  using: composite
  steps:
    - name: Check for Bun
      id: bun
      shell: bash
      run: |
        if command -v bun >/dev/null 2>&1; then
          echo "available=true" >> "${GITHUB_OUTPUT}"
        fi
    - name: Setup Bun
      if: steps.bun.outputs.available != 'true'
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest
    - shell: bash
      env:
        RELEASE_CONTEXT: ${{ inputs.context }}
        PREPARATION_MODE: ${{ inputs.mode }}
      run: bun "${GITHUB_ACTION_PATH}/../runtime/prepare.mjs"
    - id: submit
      if: inputs.mode == 'submit'
      shell: bash
      env:
        SERVICE_ORIGIN: ${{ inputs.service }}
      run: bun "${GITHUB_ACTION_PATH}/../runtime/client.mjs" prepared
