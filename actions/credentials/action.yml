name: Release automation credentials
description: Credentials a repository release operation using GitHub OIDC
inputs:
  service:
    description: Release automation service origin
    default: https://beepboop.kjanat.dev
  execution-id:
    description: Execution ID from dispatch or the begin action
    required: false
  aliases:
    description: JSON array of granted aliases
    required: true
outputs:
  values:
    description: JSON object of masked credential values
    value: ${{ steps.client.outputs.values }}
runs:
  using: composite
  steps:
    - name: Check for Bun
      id: bun
      shell: bash
      run: |
        if command -v bun >/dev/null 2>&1; then
          echo "available=true" >> "${GITHUB_OUTPUT}"
        fi
    - name: Setup Bun
      if: steps.bun.outputs.available != 'true'
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest
    - id: client
      shell: bash
      env:
        SERVICE_ORIGIN: ${{ inputs.service }}
        EXECUTION_ID: ${{ inputs.execution-id }}
        ALIASES: ${{ inputs.aliases }}
      run: bun "${GITHUB_ACTION_PATH}/../runtime/client.ts" credentials
