name: Beepboop token
description: A Beepboop GitHub App token for this repository, using GitHub OIDC
inputs:
  service:
    description: Beepboop service origin
    default: https://beepboop.kjanat.dev
  permissions:
    description: JSON object of GitHub App permissions, each read or write
    default: '{"contents":"write","pull_requests":"write"}'
outputs:
  token:
    description: Masked installation token scoped to this repository
    value: ${{ steps.client.outputs.token }}
runs:
  using: composite
  steps:
    - name: Check for Bun
      id: bun
      shell: bash
      run: |
        if command -v bun >/dev/null 2>&1; then
          echo "available=true" >> "${GITHUB_OUTPUT}"
        fi
    - name: Setup Bun
      if: steps.bun.outputs.available != 'true'
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest
    - id: client
      shell: bash
      env:
        SERVICE_ORIGIN: ${{ inputs.service }}
        PERMISSIONS: ${{ inputs.permissions }}
      run: bun "${GITHUB_ACTION_PATH}/../runtime/client.mjs" token
