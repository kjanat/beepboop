name: Release automation begin
description: Begin a repository release operation using GitHub OIDC
inputs:
  service:
    description: Release automation service origin
    default: https://beepboop.kjanat.dev
  execution-id:
    description: Execution ID from dispatch or the begin action
    required: false
  stream:
    description: stream
    default: main
  operation:
    description: operation
    default: publish
  version:
    description: version
    default: ""
outputs:
  execution-id:
    description: execution-id
    value: ${{ steps.client.outputs.execution-id }}
  context:
    description: context
    value: ${{ steps.client.outputs.context }}
runs:
  using: composite
  steps:
    - name: Check for Bun
      id: bun
      shell: bash
      run: |
        if command -v bun >/dev/null 2>&1; then
          echo "available=true" >> "${GITHUB_OUTPUT}"
        fi
    - name: Setup Bun
      if: steps.bun.outputs.available != 'true'
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest
    - id: client
      shell: bash
      env:
        SERVICE_ORIGIN: ${{ inputs.service }}
        EXECUTION_ID: ${{ inputs.execution-id }}
        STREAM: ${{ inputs.stream }}
        OPERATION: ${{ inputs.operation }}
        RELEASE_VERSION: ${{ inputs.version }}
      run: bun "${GITHUB_ACTION_PATH}/../runtime/client.ts" begin
