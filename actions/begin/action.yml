name: Release automation begin
description: Begin a repository release operation using GitHub OIDC
inputs:
  service:
    description: Release automation service origin
    default: https://beepboop.kjanat.dev
  execution-id:
    description: Execution ID from dispatch or the begin action
    required: false
  stream:
    description: stream
    default: main
  operation:
    description: operation
    default: publish
  version:
    description: version
    default: ""
outputs:
  execution-id:
    description: execution-id
    value: ${{ steps.client.outputs.execution-id }}
  context:
    description: context
    value: ${{ steps.client.outputs.context }}
runs:
  using: composite
  steps:
    - id: client
      shell: bash
      env:
        SERVICE_ORIGIN: ${{ inputs.service }}
        EXECUTION_ID: ${{ inputs.execution-id }}
        STREAM: ${{ inputs.stream }}
        OPERATION: ${{ inputs.operation }}
        RELEASE_VERSION: ${{ inputs.version }}
      run: node "${{ github.action_path }}/../runtime/client.mjs" begin
