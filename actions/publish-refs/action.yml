name: Publish release refs
description: Publish the execution's authorized version tag or major/minor aliases
inputs:
  token:
    description: Destination repository token with contents write permission
    required: true
  service:
    description: Beepboop service origin
    default: https://beepboop.kjanat.dev
runs:
  using: composite
  steps:
    - name: Check for Bun
      id: bun
      shell: bash
      run: |
        if command -v bun >/dev/null 2>&1; then
          echo "available=true" >> "${GITHUB_OUTPUT}"
        fi
    - name: Setup Bun
      if: steps.bun.outputs.available != 'true'
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest
    - id: plan
      shell: bash
      env:
        SERVICE_ORIGIN: ${{ inputs.service }}
      run: bun "${GITHUB_ACTION_PATH}/../runtime/client.ts" refs-plan
    - shell: bash
      env:
        REF_PLAN: ${{ steps.plan.outputs.result }}
        REF_TOKEN: ${{ inputs.token }}
      run: bun "${GITHUB_ACTION_PATH}/../runtime/refs.ts"
    - shell: bash
      env:
        SERVICE_ORIGIN: ${{ inputs.service }}
      run: bun "${GITHUB_ACTION_PATH}/../runtime/client.ts" refs-complete
