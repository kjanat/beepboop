name: Publish release refs
description: Publish the execution's authorized version tag or major/minor aliases
inputs:
  token:
    description: Destination repository token with contents write permission
    required: true
  manifest-path:
    description: Canonical manifest from prepare-distribution; omit for source-only releases
    default: ""
  bundle-path:
    description: Sigstore bundle from the built-in provenance attestation action
    default: ""
  service:
    description: Beepboop service origin
    default: https://beepboop.kjanat.dev
runs:
  using: composite
  steps:
    - name: Setup Bun
      id: bun
      uses: $/actions/deps/bun
    - name: Plan refs
      id: plan
      shell: bash
      env:
        SERVICE_ORIGIN: "${{ inputs.service }}"
        DISTRIBUTION_MANIFEST: "${{ inputs.manifest-path }}"
        DISTRIBUTION_BUNDLE: "${{ inputs.bundle-path }}"
        SCRIPT: "${{ github.action_path }}/../runtime/client.ts"
      run: bun "${SCRIPT}" refs-plan
    - name: Push refs
      shell: bash
      env:
        REF_PLAN: "${{ steps.plan.outputs.result }}"
        REF_TOKEN: "${{ inputs.token }}"
        SCRIPT: "${{ github.action_path }}/../runtime/refs.ts"
      run: bun "${SCRIPT}"
    - name: Confirm refs
      shell: bash
      env:
        SERVICE_ORIGIN: "${{ inputs.service }}"
        SCRIPT: "${{ github.action_path }}/../runtime/client.ts"
      run: bun "${SCRIPT}" refs-complete
