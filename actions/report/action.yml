name: Release automation report
description: Report a repository release operation using GitHub OIDC
inputs:
  service:
    description: Release automation service origin
    default: https://beepboop.kjanat.dev
  execution-id:
    description: Execution ID from dispatch or the begin action
    required: false
  publications:
    description: JSON array of publications. A rate-limited publication sets outcome rate-limited and retryAfter to the registry's Retry-After time
    default: "[]"
  artifacts:
    description: JSON array of artifacts
    default: "[]"
outputs:
  result:
    description: Recorded execution
    value: ${{ steps.client.outputs.result }}
runs:
  using: composite
  steps:
    - name: Ensure Bun is available
      id: bun
      uses: $/actions/deps/bun
    - id: client
      shell: bash
      env:
        ARTIFACTS: ${{ inputs.artifacts }}
        EXECUTION_ID: ${{ inputs.execution-id }}
        PUBLICATIONS: ${{ inputs.publications }}
        SERVICE_ORIGIN: ${{ inputs.service }}
      run: bun "${GITHUB_ACTION_PATH}/../runtime/client.ts" report
