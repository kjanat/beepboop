name: Release automation publish
description: Publish the execution's packages, attested distribution, refs and GitHub release as authorized by Beepboop
inputs:
  service:
    description: Release automation service origin
    default: https://beepboop.kjanat.dev
  execution-id:
    description: Execution ID from dispatch or the begin action
    required: false
  credentials:
    description: JSON object mapping environment variable names to granted credential aliases
    default: "{}"
  npm-tarballs:
    description: Directory of prebuilt npm tarballs. A generated npm package publishes only from here
    default: ""
runs:
  using: composite
  steps:
    - name: Setup Bun
      id: bun
      uses: $/actions/deps/bun
    - name: Prepare publication
      id: prepare
      shell: bash
      env:
        REPOSITORY_PRIVATE: ${{ toJSON(github.event.repository.private) }}
        CREDENTIALS: ${{ inputs.credentials }}
        NPM_TARBALLS: ${{ inputs.npm-tarballs }}
        EXECUTION_ID: ${{ inputs.execution-id }}
        SERVICE_ORIGIN: ${{ inputs.service }}
      run: bun "${GITHUB_ACTION_PATH}/../runtime/publish.ts" prepare
    - name: Attest distribution provenance
      id: provenance
      if: ${{ steps.prepare.outputs.distribution == 'true' }}
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-checksums: ${{ steps.prepare.outputs.subject-checksums }}
    - name: Complete publication
      shell: bash
      env:
        EXECUTION_ID: ${{ inputs.execution-id }}
        SERVICE_ORIGIN: ${{ inputs.service }}
        DISTRIBUTION_MANIFEST: ${{ steps.prepare.outputs.manifest-path }}
        DISTRIBUTION_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
      run: bun "${GITHUB_ACTION_PATH}/../runtime/publish.ts" complete
