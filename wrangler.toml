#:schema https://cdn.jsdelivr.net/npm/wrangler@4/config-schema.json

name                = "beepboop"
account_id          = "83a61abe8741defe835d035b1f4e49af"
main                = "src/index.ts"
compatibility_date  = "2026-10-20"
workers_dev         = false
preview_urls        = false
upload_source_maps  = true
send_metrics        = true
compatibility_flags = ["nodejs_compat"]

[[routes]]
pattern       = "beepboop.kjanat.dev"
custom_domain = true

[observability]
enabled             = true
head_sampling_rate  = 1
redact_query_string = false

[observability.logs]
enabled            = true
head_sampling_rate = 1
invocation_logs    = true
persist            = true

[observability.traces]
enabled            = true
head_sampling_rate = 1
persist            = true

[observability.issues]
enabled = true

[triggers]
crons = ["*/10 * * * *"]

[[workflows]]
name       = "beepboop-release"
binding    = "RELEASE_WORKFLOW"
class_name = "ReleaseWorkflow"

[[durable_objects.bindings]]
name       = "AUTOMATION"
class_name = "AutomationCoordinator"

[[durable_objects.bindings]]
name       = "PUBLISH_BUDGET"
class_name = "PublishBudget"

[[migrations]]
tag                = "v1"
new_sqlite_classes = ["ReleaseCoordinator"]

[[migrations]]
tag                = "v2"
new_sqlite_classes = ["AutomationCoordinator"]
deleted_classes    = ["ReleaseCoordinator"]

[[migrations]]
tag                = "v3"
new_sqlite_classes = ["PublishBudget"]

[vars]
APPLICATION_ORIGIN = "https://beepboop.kjanat.dev"
OPENAUTH_ISSUER    = "https://auth.kjanat.com"
OPENAUTH_CLIENT_ID = "beepboop"
OWNER_ID           = "6353477"
ADMIN_SUBJECT      = "57513d5461547c30a38d12deeed83320"
VAULT_ACTIVE_KEY   = "v1"

[[d1_databases]]
binding        = "DB"
database_name  = "beepboop"
database_id    = "19241404-a424-4771-8093-0c13a22b0958"
migrations_dir = "migrations"

[secrets]
required = ["GITHUB_APP_ID", "GITHUB_APP_PRIVATE_KEY", "GITHUB_WEBHOOK_SECRET", "VAULT_KEYS"]
