name: Extra
run-name: ${{ inputs.beepboop_title || github.workflow }}
on:
  workflow_dispatch:
    inputs:
      beepboop_execution_id: { type: string, required: true }
      beepboop_title: { type: string, required: false }
permissions: { contents: read, id-token: write }
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      source: ${{ fromJSON(steps.start.outputs.context).sourceSha }}
    steps:
      - uses: kjanat/beepboop/actions/begin@v1
        id: start
        with: { execution-id: "${{ inputs.beepboop_execution_id }}", stream: git-remote-refs, operation: extra }
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: extra
    steps:
      - uses: kjanat/beepboop/actions/begin@v1
        id: beepboop
        with: { execution-id: "${{ inputs.beepboop_execution_id }}", stream: git-remote-refs, operation: extra }
      - uses: actions/checkout@v7
        with: { ref: "${{ needs.build.outputs.source }}" }
      - uses: kjanat/beepboop/actions/credentials@v1
        id: credentials
        with: { execution-id: "${{ steps.beepboop.outputs.execution-id }}", aliases: '["extra-token"]' }
      - id: npm
        run: npm publish
      - uses: kjanat/beepboop/actions/report@v1
        with:
          execution-id: ${{ steps.beepboop.outputs.execution-id }}
          publications: '[{"id":"pkg:npm/git-remote-refs"}]'
